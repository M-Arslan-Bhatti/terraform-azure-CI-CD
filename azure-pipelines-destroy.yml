# ═══════════════════════════════════════════════
# DESTROY PIPELINE
# trigger: none → CI/push pe kabhi automatic nahi chalti
# pr: none      → PR pe bhi kabhi automatic nahi chalti
#                 (dono zaroori hain - "trigger: none" akela
#                 PR-triggering ko nahi rokta, Azure DevOps
#                 default se PR pe bhi chala deta hai agar
#                 "pr:" explicitly na diya jaye. Real incident
#                 isi gap ki wajah se hua tha.)
# Sirf manual "Run pipeline" se chalti hai
# ═══════════════════════════════════════════════
trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: vg-terraform-dev
- name: TF_VERSION
  value: '1.15.7'

stages:

# ─── STAGE 1: PREVIEW - Kya delete hoga, poori list dikhao ───
- stage: DestroyPlan
  displayName: '1 - Destroy Plan (Preview Only)'
  jobs:
  - job: PlanDestroy
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(TF_VERSION)

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'  # NAYA: module refactor ke baad .tf files yahan hain, root mein nahi
        backendType: 'azurerm'
        backendServiceArm: 'azure-terraform-connection'
        backendAzureRmResourceGroupName: 'rg-terraform-state'
        backendAzureRmStorageAccountName: 'starslanterraform001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev-v2.terraform.tfstate'  # NAYA: environments/dev/backend.tf ka actual key

    # Yeh step LOGS mein poori DELETE list dikhayega
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan Destroy (Check Logs Here!)'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
        commandOptions: >-
          -destroy
          -var-file=dev.tfvars
          -var="environment=$(TF-ENVIRONMENT)"
          -var="location=$(TF-LOCATION)"
          -var="extra_tags={Owner=\"$(TF-OWNER)\"}"
          -var="vnet_cidr=$(TF-VNET-CIDR-VAL)"
          -input=false
        environmentServiceNameAzureRM: 'azure-terraform-connection'

# ─── STAGE 2: ACTUAL DESTROY (Manual Approval Ke Saath) ───
- stage: ExecuteDestroy
  displayName: '2 - Execute Destroy'
  dependsOn: DestroyPlan
  condition: succeeded()
  jobs:
  - deployment: Destroy
    displayName: 'Terraform Destroy'
    environment: 'dev-destroy'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
              backendType: 'azurerm'
              backendServiceArm: 'azure-terraform-connection'
              backendAzureRmResourceGroupName: 'rg-terraform-state'
              backendAzureRmStorageAccountName: 'starslanterraform001'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev-v2.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Destroy'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
              commandOptions: >-
                -var-file=dev.tfvars
                -var="environment=$(TF-ENVIRONMENT)"
                -var="location=$(TF-LOCATION)"
                -var="extra_tags={Owner=\"$(TF-OWNER)\"}"
                -var="vnet_cidr=$(TF-VNET-CIDR-VAL)"
                -input=false
              environmentServiceNameAzureRM: 'azure-terraform-connection'