trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_VERSION: '1.15.7'

stages:

- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: Validate
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(TF_VERSION)

    - task: TerraformTaskV4@4
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendType: 'local'

    - task: TerraformTaskV4@4
      displayName: 'Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'

- stage: Plan
  displayName: 'Plan'
  dependsOn: Validate
  jobs:
  - job: Plan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(TF_VERSION)

    - task: TerraformTaskV4@4
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendType: 'local'

    - task: TerraformTaskV4@4
      displayName: 'Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        commandOptions: '-var-file=environments/dev.tfvars'
        environmentServiceNameAzureRM: 'azure-terraform-connection'

- stage: Apply
  displayName: 'Apply'
  dependsOn: Plan
  jobs:
  - deployment: Apply
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: TerraformTaskV4@4
            displayName: 'Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendType: 'local'

          - task: TerraformTaskV4@4
            displayName: 'Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-var-file=environments/dev.tfvars'
              environmentServiceNameAzureRM: 'azure-terraform-connection'